name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python3 -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples .github/scripts
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Release guard tests
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Compile
        run: PYTHONPATH=src python3 -m compileall -q src tests examples .github/scripts
      - name: CLI sample smoke
        run: |
          PYTHONPATH=src python3 -m phi_boundary_gate.cli \
            --trace samples/traces/claim_agent_minimal.jsonl \
            --policy samples/policies/default.yml \
            --out /tmp/phi-sample-report.md \
            --json /tmp/phi-sample-report.json \
            --redacted-trace /tmp/phi-sample-redacted.jsonl
          PYTHONPATH=src python3 -m phi_boundary_gate.cli \
            --trace samples/traces/expanded_phi_variants.jsonl \
            --policy samples/policies/default.yml \
            --out /tmp/phi-expanded-report.md \
            --json /tmp/phi-expanded-report.json
      - name: Trace corpus coverage baseline
        run: |
          PYTHONPATH=src python3 tools/trace_corpus_report.py \
            --traces samples/traces \
            --expectations samples/trace_expectations \
            --policy samples/policies/default.yml \
            --out /tmp/trace-corpus-coverage.json
          diff -u reports/trace-corpus-coverage.json /tmp/trace-corpus-coverage.json
      - name: Package smoke
        run: |
          python3 -m build
          python3 -m twine check dist/*
          python3 -m pip install --no-build-isolation --no-deps --target /tmp/phi-package-smoke .
          test -f /tmp/phi-package-smoke/phi_boundary_gate/py.typed
          test -f /tmp/phi-package-smoke/phi_boundary_gate/templates/phi-policy.yml
          PYTHONPATH=/tmp/phi-package-smoke python3 -c "from phi_boundary_gate import __version__, PhiBoundaryGate, PhiBoundaryGateError, TraceAdapter, TraceMappingError, guard_text, guard_compliance, load_external_trace, validate_trace_mapping; print(__version__, PhiBoundaryGate.__name__, PhiBoundaryGateError.__name__, TraceAdapter.__name__, TraceMappingError.__name__, guard_text.__name__, guard_compliance.__name__, load_external_trace.__name__, validate_trace_mapping.__name__)"
          PYTHONPATH=/tmp/phi-package-smoke python3 examples/sdk_guard_model_input.py
          PYTHONPATH=/tmp/phi-package-smoke python3 examples/sdk_redact_logs.py
          PYTHONPATH=/tmp/phi-package-smoke python3 examples/trace_mapping_pipeline.py \
            --out /tmp/phi-package-example-normalized.jsonl
          diff -u samples/normalized_traces/generic_agent_expected.jsonl /tmp/phi-package-example-normalized.jsonl
          PYTHONPATH=/tmp/phi-package-smoke python3 -m phi_boundary_gate.cli --help
          PYTHONPATH=/tmp/phi-package-smoke python3 -m phi_boundary_gate.cli validate-mapping \
            --mapping samples/trace_mappings/generic_agent.yml
          PYTHONPATH=/tmp/phi-package-smoke python3 -m phi_boundary_gate.cli convert-trace \
            --input samples/external_traces/generic_agent_run.jsonl \
            --mapping samples/trace_mappings/generic_agent.yml \
            --out /tmp/phi-package-normalized.jsonl
          diff -u samples/normalized_traces/generic_agent_expected.jsonl /tmp/phi-package-normalized.jsonl
          PYTHONPATH=/tmp/phi-package-smoke python3 -m phi_boundary_gate.cli validate-trace \
            --trace /tmp/phi-package-normalized.jsonl

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version copies agree and shipped surface is bumped
        run: |
          python3 .github/scripts/check_release_version.py \
            --base-ref "origin/${{ github.base_ref || 'main' }}"
