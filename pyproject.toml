[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-context-boundary-report"
version = "0.3.2"
description = "Synthetic PHI context boundary reporting and compliance guard toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ner = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "spacy>=3.7.0",
]

[project.scripts]
phi-boundary-report = "phi_boundary_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
