[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-boundary-gate"
version = "0.5.5"
description = "Synthetic PHI boundary gating, redaction, and audit reporting toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tigerless-labs" }]
maintainers = [{ name = "tigerless-labs" }]
keywords = [
  "phi",
  "hipaa",
  "redaction",
  "privacy",
  "ai-safety",
  "audit",
  "healthcare",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/tigerless-labs/phi-boundary-gate"
Repository = "https://github.com/tigerless-labs/phi-boundary-gate"
Issues = "https://github.com/tigerless-labs/phi-boundary-gate/issues"
Documentation = "https://github.com/tigerless-labs/phi-boundary-gate/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "ruff>=0.6.0",
  "twine>=5.0.0",
]
ner = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "spacy>=3.7.0",
]

[project.scripts]
phi-boundary-gate = "phi_boundary_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phi_boundary_gate = ["py.typed", "templates/*.yml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
