[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-boundary-gate"
version = "0.4.0"
description = "Synthetic PHI boundary gating, redaction, and audit reporting toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ner = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "spacy>=3.7.0",
]

[project.scripts]
phi-boundary-gate = "phi_boundary_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
